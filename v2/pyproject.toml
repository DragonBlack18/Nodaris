[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodaris-v2"
version = "0.1.0"
description = "NODARIS V2 - local network availability monitor"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "PySide6>=6.11,<7",
  "uvicorn>=0.52,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.22,<7",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
